name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: evidence-node-${{ matrix.node }}
          path: test-results/
          retention-days: 7
  release:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release v0.1.0]')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - run: npm run showcase
      - name: Commit verified synthetic demo media
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/media
          if ! git diff --cached --quiet; then
            git commit -m 'docs: add verified release recordings'
            git push origin HEAD:main
          fi
      - run: npm pack
      - name: Publish v0.1.0 package and demos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.0 ray0766-demopilot-0.1.0.tgz docs/media/showcase.mp4 docs/media/demo.gif --target "$(git rev-parse HEAD)" --title 'DemoPilot v0.1.0 — Record again, keep the edit' --notes-file docs/RELEASE-v0.1.0.md
